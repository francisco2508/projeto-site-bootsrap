<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato — Casa Doce</title>
    <link rel="icon" type="image/png" href="imagens/logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
            <img src="imagens/logo.png" alt="Logo Casa Doce" style="height: 55px; width: auto; margin-right: 10px;">
            <span>Casa Doce</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section id="contato" class="py-5 bg-light">
    <div class="container">

        <h2 class="text-center mb-4 fw-bold">Contato</h2>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <form class="p-4 rounded shadow-sm bg-white">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" placeholder="Seu nome" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Seu email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mensagem</label>
                        <textarea class="form-control" rows="4" placeholder="Escreva sua mensagem..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Enviar</button>
                </form>
            </div>
        </div>

        <div class="row mt-5 justify-content-center text-center">
            <h5 class="fw-bold">Localização:</h5>

            <div class="map-container mb-4">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3658.839861498685!2d-46.59758008447644!3d-23.50705866546045!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce58577231635b%3A0x76db5f0c772b0518!2sSão%20Paulo!5e0!3m2!1spt-BR!2sbr!4v1700000000000"
                    width="100%" 
                    height="350" 
                    style="border:0; border-radius: 10px;" 
                    allowfullscreen 
                    loading="lazy">
                </iframe>
            </div>

            <div class="col-md-4 mb-3">
                <div class="p-3 bg-white shadow-sm rounded">
                    <h5 class="fw-bold">📞 Telefone</h5>
                    <p class="mb-0">(11) 99999-9999</p>
                    <p class="text-muted">Atendimento 08h às 18h</p>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="p-3 bg-white shadow-sm rounded">
                    <h5 class="fw-bold">📧 Email</h5>
                    <p class="mb-0">contato@casadoce.com</p>
                    <p class="text-muted">Respondemos em até 24 horas</p>
                </div>
            </div>

        </div>

    </div>
</section>

<footer class="py-4 mt-5" style="background-color: #5c3a1e;">
    <div class="container text-center">
        <p class="fw-bold mb-2 text-white">Siga a Casa Doce 🍫</p>

        <div class="d-flex justify-content-center gap-4 fs-4">
            <a href="https://instagram.com" target="_blank" class="text-white"><i class="bi bi-instagram"></i></a>
            <a href="https://facebook.com" target="_blank" class="text-white"><i class="bi bi-facebook"></i></a>
            <a href="https://wa.me/5511999999999" target="_blank" class="text-white"><i class="bi bi-whatsapp"></i></a>
            <a href="https://tiktok.com" target="_blank" class="text-white"><i class="bi bi-tiktok"></i></a>
        </div>

        <p class="mt-3 text-white-50 small">© 2025 Casa Doce — Todos os direitos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
