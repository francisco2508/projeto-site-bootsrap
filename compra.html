<div class="container py-5" style="max-width: 800px;">
  <h2 class="fw-bold text-center mb-4">Finalizar Compra</h2>

  <div class="p-4 bg-white rounded shadow-sm">
    <h4 class="fw-bold mb-3">Seus Dados</h4>

    <form id="formFinalizar">
      <div class="mb-3">
        <label class="form-label">Nome completo</label>
        <input type="text" class="form-control" placeholder="Ex: Maria da Silva" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="tel" class="form-control" placeholder="(11) 99999-9999" required>
      </div>

      <h5 class="fw-bold mt-4 mb-3">Endereço</h5>

      <div class="mb-3">
        <label class="form-label">Rua</label>
        <input type="text" class="form-control" placeholder="Nome da rua" required>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Número</label>
          <input type="text" class="form-control" placeholder="123" required>
        </div>
        <div class="col-md-8 mb-3">
          <label class="form-label">Bairro</label>
          <input type="text" class="form-control" placeholder="Seu bairro" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Complemento (opcional)</label>
        <input type="text" class="form-control" placeholder="Apto, bloco, referência...">
      </div>

      <h5 class="fw-bold mt-4 mb-3">Pagamento</h5>

      <select class="form-select mb-3" required>
        <option value="">Selecione a forma de pagamento</option>
        <option>Cartão de Crédito</option>
        <option>Cartão de Débito</option>
        <option>Pix</option>
        <option>Dinheiro</option>
      </select>

      <textarea class="form-control mb-4" rows="3" placeholder="Observações do pedido (opcional)"></textarea>

      <button class="btn btn-primary w-100 btn-lg" type="submit">
        Confirmar Pedido
      </button>
    </form>

  </div>
</div>
